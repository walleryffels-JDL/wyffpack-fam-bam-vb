<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1D2840">
  <title>Wyffpack Sign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=block">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="sign.css">
</head>
<body>
  <main class="scene">
    <canvas class="snow" id="snow" aria-hidden="true"></canvas>
    <div class="sign" id="sign">
      <!-- Black arrow rail with globe bulbs, across the top of the sign -->
      <svg class="topper" id="topper" viewBox="0 0 920 250" aria-hidden="true">
        <defs>
          <radialGradient id="glass-off" cx="0.38" cy="0.32" r="0.75">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="0.45" stop-color="#D9DCDF"/>
            <stop offset="1" stop-color="#9DA2A8"/>
          </radialGradient>
          <radialGradient id="glass-on" cx="0.4" cy="0.35" r="0.7">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="0.6" stop-color="#FFF8DC"/>
            <stop offset="1" stop-color="#FFE7A0"/>
          </radialGradient>
          <radialGradient id="glass-red" cx="0.4" cy="0.35" r="0.7">
            <stop offset="0" stop-color="#FFE2E2"/>
            <stop offset="0.55" stop-color="#FF4A4A"/>
            <stop offset="1" stop-color="#C40E0E"/>
          </radialGradient>
          <radialGradient id="glass-green" cx="0.4" cy="0.35" r="0.7">
            <stop offset="0" stop-color="#E4FFE8"/>
            <stop offset="0.55" stop-color="#3FD45E"/>
            <stop offset="1" stop-color="#11872B"/>
          </radialGradient>
          <radialGradient id="glass-gold" cx="0.4" cy="0.35" r="0.7">
            <stop offset="0" stop-color="#FFFBE6"/>
            <stop offset="0.55" stop-color="#FFD54A"/>
            <stop offset="1" stop-color="#E0A000"/>
          </radialGradient>
          <radialGradient id="halo-red">
            <stop offset="0" stop-color="#FF8080" stop-opacity="0.85"/>
            <stop offset="0.4" stop-color="#FF3030" stop-opacity="0.4"/>
            <stop offset="1" stop-color="#FF0000" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="halo-green">
            <stop offset="0" stop-color="#90FFA4" stop-opacity="0.85"/>
            <stop offset="0.4" stop-color="#30D050" stop-opacity="0.4"/>
            <stop offset="1" stop-color="#00B030" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="halo-gold">
            <stop offset="0" stop-color="#FFF0B0" stop-opacity="0.9"/>
            <stop offset="0.4" stop-color="#FFD040" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#FFB000" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="halo">
            <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.9"/>
            <stop offset="0.4" stop-color="#FFE29A" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#FFD070" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3A3D42"/>
            <stop offset="0.25" stop-color="#16171A"/>
            <stop offset="1" stop-color="#0B0B0D"/>
          </linearGradient>
        </defs>
        <rect class="rail" x="118" y="90" width="802" height="85" rx="4"/>
        <polygon class="arrowhead" points="124,-14 124,278 -44,132" />
        <!-- Snow piled along the top of the arrow (Christmas theme only) -->
        <path class="snowcap" d="M118,96 C140,70 170,74 190,82 C215,66 250,70 270,80 C300,64 335,72 355,80
          C385,66 420,70 440,80 C470,64 505,70 525,82 C555,66 590,72 610,80 C640,64 675,70 695,80
          C725,66 760,70 780,82 C810,66 845,70 865,80 C885,70 905,72 920,84 L920,100 L118,100 Z"/>
        <g id="bulbs"></g>
      </svg>

      <div class="panel">
        <div class="tracks" id="tracks"></div>
      </div>
    </div>
  </main>
  <script type="module" src="sign.js"></script>
</body>
</html>
